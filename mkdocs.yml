site_name: RanMatrix
site_url: https://randy-afk.github.io/RanMatrix/
repo_url: https://github.com/randy-afk/RanMatrix
repo_name: randy-afk/RanMatrix

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  logo: assets/logo_docs.png
  favicon: assets/logo_docs.png

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: quickstart.md
  - User Guide:
    - UI Overview: overview.md
    - Element Palette: elements.md
    - Linac vs Ring Mode: modes.md
    - Matrix Panel: matrices.md
    - Phase Space: phase_space.md
    - Step Mode: step_mode.md
  - Physics Reference: physics.md
  - Examples: examples.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - attr_list
